<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="calc">
      <div id="display">0</div>
      <div class="buttons">
        <button class="num-btn" id="btn7">7</button>
        <button class="num-btn" id="btn8">8</button>
        <button class="num-btn" id="btn9">9</button>
        <button id="divide">/</button>
        <button class="num-btn" id="btn4">4</button>
        <button class="num-btn" id="btn5">5</button>
        <button class="num-btn" id="btn6">6</button>
        <button id="times">*</button>
        <button class="num-btn" id="btn1">1</button>
        <button class="num-btn" id="btn2">2</button>
        <button class="num-btn" id="btn3">3</button>
        <button id="plus">+</button>
        <button class="num-btn" id="btn0">0</button>
        <button id="btndot">.</button>
        <button id="modulus">%</button>
        <button id="minus">-</button>
        <button id="clear">CLR</button>
        <button id="del">DEL</button>
        <button id="equal">=</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
